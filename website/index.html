<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Documentación de hueman: paletas YAML, templates Jinja y targets declarativos para themear tus tools."
    />
    <title>hueman — documentación</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/site.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c0f14'/%3E%3Crect x='8' y='8' width='16' height='16' rx='4' fill='%235b8def'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <div class="progress" id="read-progress" aria-hidden="true"></div>

    <div class="shell">
      <header class="topbar" role="banner">
        <div class="topbar__inner">
          <div class="topbar__brand">
            <button
              type="button"
              class="nav-toggle"
              id="nav-toggle"
              aria-controls="sidebar"
              aria-expanded="false"
              aria-label="Abrir menú de navegación"
            >
              <span></span><span></span><span></span>
            </button>
            <a class="brand" href="?v=latest&p=intro" data-link>
              <span class="brand__mark" aria-hidden="true"></span>
              <span class="brand__text">hueman</span>
              <span class="brand__sep" aria-hidden="true">/</span>
              <span class="brand__docs">docs</span>
            </a>
          </div>

          <div class="topbar__meta">
            <label class="version-picker">
              <span class="version-picker__label">Versión</span>
              <select id="version-select" aria-label="Versión de la documentación"></select>
            </label>
            <a
              class="btn btn--ghost"
              href="https://github.com/4DRIAN0RTIZ/hueman"
              rel="noopener noreferrer"
              target="_blank"
              >GitHub</a
            >
          </div>
        </div>
      </header>

      <div class="layout">
        <aside class="sidebar" id="sidebar" role="navigation" aria-label="Secciones">
          <nav id="side-nav" class="side-nav" aria-label="Documentación"></nav>
        </aside>

        <button type="button" class="backdrop" id="nav-backdrop" hidden aria-label="Cerrar menú"></button>

        <main class="main" id="contenido" tabindex="-1">
          <header class="page-header" id="hero">
            <p class="page-header__eyebrow">Documentación</p>
            <h1 class="page-header__title" id="hero-title">hueman</h1>
            <p class="page-header__lead" id="hero-lead">
              Una paleta YAML, templates Jinja y targets declarativos para themear
              tus tools — incluida la tuya.
            </p>
            <div class="page-header__meta" id="hero-badges" aria-live="polite"></div>
          </header>

          <article class="doc" id="doc" aria-busy="true">
            <p class="doc__loading">Cargando documentación…</p>
          </article>

          <nav class="pager" id="pager" aria-label="Páginas relacionadas"></nav>
        </main>
      </div>

      <footer class="footer" role="contentinfo">
        <div class="footer__inner">
          <p>
            <span id="footer-version">—</span>
            · actualizado
            <time id="footer-updated" datetime="">—</time>
          </p>
          <p class="footer__note">Sitio estático · <code>website/content/</code></p>
        </div>
      </footer>
    </div>

    <script src="assets/js/marked.min.js" defer></script>
    <script src="assets/js/app.js" defer></script>
  </body>
</html>
