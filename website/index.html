<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Documentación de hueman: paletas YAML, templates Jinja y targets declarativos para themear tus tools."
    />
    <title>hueman — documentación</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/site.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f4f1ea'/%3E%3Crect x='6' y='6' width='8' height='20' fill='%23111111'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>

    <div class="frame">
      <!-- Vertical brand spine -->
      <aside class="spine" aria-hidden="true">
        <div class="spine__mark"></div>
        <p class="spine__word">hueman</p>
        <p class="spine__meta" id="spine-meta">docs</p>
      </aside>

      <div class="workspace">
        <header class="utility" role="banner">
          <button
            type="button"
            class="nav-toggle"
            id="nav-toggle"
            aria-controls="index"
            aria-expanded="false"
            aria-label="Abrir índice"
          >
            Índice
          </button>

          <div class="utility__cluster">
            <label class="version-picker">
              <span class="version-picker__label">rev</span>
              <select id="version-select" aria-label="Versión de la documentación"></select>
            </label>
            <a
              class="utility__link"
              href="https://github.com/4DRIAN0RTIZ/hueman"
              rel="noopener noreferrer"
              target="_blank"
              >fuente</a
            >
          </div>
        </header>

        <div class="board">
          <!-- Unconventional index: numbered ledger, not a classic sidebar list -->
          <nav class="index" id="index" aria-label="Índice">
            <header class="index__head">
              <p class="index__kicker">Índice</p>
              <p class="index__hint">estructura del manual</p>
            </header>
            <div id="side-nav" class="ledger"></div>
          </nav>

          <button type="button" class="backdrop" id="nav-backdrop" hidden aria-label="Cerrar índice"></button>

          <main class="stage" id="contenido" tabindex="-1">
            <div class="sheet">
              <div class="sheet__rule" aria-hidden="true"></div>

              <header class="masthead" id="hero">
                <div class="masthead__ids">
                  <span class="stamp" id="page-stamp">—</span>
                  <div class="masthead__badges" id="hero-badges" aria-live="polite"></div>
                </div>
                <p class="masthead__eyebrow" id="section-label">Documentación</p>
                <h1 class="masthead__title" id="hero-title">hueman</h1>
                <p class="masthead__lead" id="hero-lead">
                  Una paleta YAML, templates Jinja y targets declarativos para
                  themear tus tools — incluida la tuya.
                </p>
              </header>

              <div class="sheet__split">
                <article class="doc" id="doc" aria-busy="true">
                  <p class="doc__loading">Cargando…</p>
                </article>

                <aside class="outline" aria-label="En esta página">
                  <p class="outline__kicker">En página</p>
                  <div id="page-outline" class="outline__list">
                    <p class="outline__empty">Sin secciones</p>
                  </div>
                  <div class="outline__foot">
                    <p id="footer-version">—</p>
                    <p>
                      act.
                      <time id="footer-updated" datetime="">—</time>
                    </p>
                  </div>
                </aside>
              </div>

              <nav class="traverse" id="pager" aria-label="Continuar lectura"></nav>
            </div>
          </main>
        </div>
      </div>

      <!-- Vertical reading progress -->
      <div class="rail" aria-hidden="true">
        <div class="rail__fill" id="read-progress"></div>
      </div>
    </div>

    <script src="assets/js/marked.min.js" defer></script>
    <script src="assets/js/app.js" defer></script>
  </body>
</html>
