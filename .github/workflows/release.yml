name: Publish release

on:
  push:
    branches: [main]
    paths-ignore:
      - CHANGELOG.md
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      released: ${{ steps.compute.outputs.released }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: bumped
        with:
          config: cliff.toml
          args: --bumped-version

      - name: Compute version and decide if release is needed
        id: compute
        env:
          BUMPED_CONTENT: ${{ steps.bumped.outputs.content }}
        run: |
          VERSION="$(printf '%s\n' "$BUMPED_CONTENT" | tail -n 1 | tr -d '[:space:]')"
          LATEST_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)"
          echo "Ultimo tag: ${LATEST_TAG:-ninguno}"
          echo "Version calculada: $VERSION"
          # git-cliff bumps the patch for any commit (even docs-only ones), so
          # only release when something user-facing landed since the last tag.
          # A manual run (workflow_dispatch) skips this check.
          RELEASABLE=true
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" && -n "$LATEST_TAG" ]]; then
            if ! git log "$LATEST_TAG..HEAD" --format='%s%n%b' \
                | grep -qE '^(feat|fix|perf)(\([^)]*\))?!?:|^BREAKING CHANGE'; then
              RELEASABLE=false
              echo "Sin commits feat/fix/perf desde $LATEST_TAG: no hay release."
            fi
          fi
          if [[ -z "$VERSION" || "$VERSION" == "$LATEST_TAG" || "$RELEASABLE" != "true" ]]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate CHANGELOG.md for the new version
        if: steps.compute.outputs.released == 'true'
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --tag ${{ steps.compute.outputs.version }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit, tag and push
        if: steps.compute.outputs.released == 'true'
        env:
          VERSION: ${{ steps.compute.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin HEAD:main
          git push origin "$VERSION"

  release:
    needs: bump
    if: needs.bump.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ needs.bump.outputs.version }}

      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip all

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.bump.outputs.version }}
          NOTES: ${{ steps.git-cliff.outputs.content }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "$NOTES"

  # Publicar aqui y no en un workflow aparte disparado por el tag: un tag
  # empujado con GITHUB_TOKEN no dispara otros workflows.
  publish:
    needs: bump
    if: needs.bump.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # Trusted Publishing (OIDC), sin tokens guardados
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # setuptools-scm necesita los tags para la version
          ref: ${{ needs.bump.outputs.version }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  sync-dev:
    needs: bump
    if: needs.bump.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: main

      # --ff-only: if dev has diverged (e.g. a changelog bot commit), fail
      # loudly instead of creating a merge or overwriting it.
      - name: Fast-forward dev to main
        run: |
          git fetch origin dev
          git checkout -B dev origin/dev
          git merge --ff-only origin/main
          git push origin dev
