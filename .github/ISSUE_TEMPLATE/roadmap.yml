name: Roadmap item
description: An entry of the public roadmap.
title: "[roadmap] <Name>"
labels: ["roadmap"]
body:
  - type: markdown
    attributes:
      value: |
        - The first paragraph of **Resumen** is shown as plain text on the public roadmap.
        - Each checkbox in **Tareas** is listed with its state.
        - Status: add a `roadmap:working`, `roadmap:planned` or `roadmap:idea` label
          (no label means "planned"). Close the issue when done.
        - Active item ("now"): add the `roadmap:now` label or self-assign the issue.
        - Milestone: use GitHub's native milestone field, not the title. It is a real phase or epic, NOT a version.
        - Everything after a `===` line stays in the issue only and is never published on the roadmap.
  - type: textarea
    id: summary
    attributes:
      label: Resumen
      description: What it is and why. The first line is shown publicly.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tareas
      value: |
        - [ ] First task
        - [ ] Second task
  - type: textarea
    id: details
    attributes:
      label: Internal details (optional)
      description: Notes or internal context. Not published on the roadmap.
      value: |
        ===
    validations:
      required: false
