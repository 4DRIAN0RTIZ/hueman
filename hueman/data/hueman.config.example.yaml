# Ejemplo mínimo de configuración de hueman.
#
# Este archivo NO vive dentro de hueman/ — cada usuario/máquina trae el
# suyo (por convención, junto al repo de dotfiles que va a themear, ej.
# "~/dotfiles/theme/hueman.config.yaml"), y se lo pasa a la herramienta
# con `hueman --config <ruta>` (o vía la variable HUEMAN_CONFIG, o
# dejándolo en ~/.config/hueman/config.yaml).
#
# No hay concepto de "entorno" ni convención de carpetas: cada target
# declara su lista explícita de archivos de salida (`outputs`). Si tenés
# varias máquinas/perfiles que comparten el mismo tema, simplemente listá
# todas las rutas ahí.

# Opcional: variables para no repetir rutas. `${repo}` se sustituye solo en
# `outputs` y `skip_unless_path_exists` de cada target, y en `state_file`,
# `palette_dirs` y `template_dirs` (nunca en reload, post_apply, patch ni
# templates). Se pueden sobreescribir con `hueman --var repo=<ruta> ...`.
# vars:
#   repo: "~/dotfiles"
# Uso: outputs: ["${repo}/kitty/theme.conf"]

# Dónde persistir el nombre de la paleta activa.
state_file: "~/.config/hueman/current"

# Paletas propias, además de las ~24 empaquetadas dentro de hueman/palettes/.
# Si una paleta custom tiene el mismo nombre que una empaquetada, gana la custom.
palette_dirs:
  - "~/dotfiles/theme/palettes.custom"

# Templates propios, para targets que la herramienta no trae por defecto.
template_dirs:
  - "~/dotfiles/theme/templates.custom"

# Politica cuando un comando `reload` o `post_apply` termina con codigo != 0:
#   warn  (default) - se registra un warning y `set` sigue; exit 0.
#   error           - se registra un error, se siguen ejecutando los demas
#                     pasos (best-effort) y `set` termina con exit 1.
# Cada target puede sobreescribirla con su propio `reload_failure`.
# El codigo de salida de cada comando siempre se registra en el log.
reload_failure: warn

# Opcional (opt-in): publica la paleta activa en la rama huerfana `hueman-state`
# del remoto de tu repo de dotfiles ({palette, revision} en hueman.state.yaml,
# un unico commit reescrito con force-with-lease). hueman usa un repo propio
# (por defecto bajo $XDG_STATE_HOME/hueman/state-sync/) y nunca toca tu working
# tree. Sin remoto, sin red o sin git, `set` aplica en local y avisa.
# `set --dry-run` y `set --only` nunca escriben ni empujan estado.
# state_sync:
#   type: git                 # git (default) | file
#   repo: "~/dotfiles"        # repo del que se toma la URL del remoto
#   remote: origin            # default
#   branch: hueman-state      # default
#   # workdir: "~/.local/state/hueman/state-sync/x.git"   # opcional
#   # timeout: 15            # segundos por llamada git (default 15)
#
# Alternativa sin git: un archivo de estado en una carpeta que ya sincroniza
# otra herramienta (Syncthing, Dropbox...). Escritura atomica; gana la mayor
# revision. Si la carpeta no existe se considera inalcanzable (no se crea).
# state_sync:
#   type: file
#   path: "~/Sync/hueman.state.yaml"

targets:
  # --- Ejemplo "overwrite": reemplaza el archivo entero.
  kitty:
    template: kitty.conf.j2
    palette_key: kitty
    mode: overwrite
    outputs:
      - "~/.config/kitty/theme.conf"
    reload: "pgrep -x kitty >/dev/null 2>&1 && pkill -USR1 -x kitty || true"
    # reload_failure: error   # override opcional de la politica global

  # --- Ejemplo "patch": splice regex sobre un archivo ya existente, sin
  # tocar el resto de su contenido (útil para configs escritas a mano,
  # como el prompt de starship).
  starship:
    template: starship_block.toml.j2
    palette_key: polybar
    mode: patch
    patch:
      marker_regex: '# --- Bloque gestionado por (?:theme_manager\.py|hueman).*?\[palettes\.dotfiles\][^\[]*'
      replacements:
        - ['style = "bold green"', 'style = "bold success"']
      ensure_after:
        - if_missing_regex: '(?m)^palette\s*='
          anchor: "add_newline = false\n"
          insert: 'palette = "dotfiles"\n'
    outputs:
      - "~/.config/starship.toml"

  # --- Ejemplo de guardas opcionales: `skip_if_missing_parent` omite una
  # salida cuyo directorio padre no existe; `skip_unless_path_exists` (ruta o
  # lista) omite TODO el target (sin escribir ni reload) salvo que existan
  # todas esas rutas, util para "solo si esta instalada la herramienta X".
  # windhawk_taskbar:
  #   template: windhawk_taskbar.json.j2
  #   palette_key: polybar
  #   skip_if_missing_parent: true
  #   skip_unless_path_exists: "/mnt/c/Windows/System32/schtasks.exe"
  #   outputs: ["/mnt/c/Users/ME/AppData/Local/DotfilesTheme/taskbar-colors.json"]

# Comandos que corren una sola vez al final de `set`, no por target.
# No corren cuando se usa `set --only ...` (re-render parcial).
# Los comandos de `reload` y `post_apply` admiten placeholders: `{name}`
# (o `{palette}`) y `{seccion.clave}` (lookup en la paleta activa, ej.
# `{kitty.color4}`); se sustituyen ya shell-quoted. `${VAR}` no se toca y
# una clave con punto inexistente es un error.
post_apply:
  # - "python3 ~/x.py --name {name} --color {kitty.color4}"
  - "command -v oh-my-posh >/dev/null 2>&1 && oh-my-posh enable reload || true"
